
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI SQL Assistant</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <script src="{% static 'js/auth.js' %}" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">AI</div>
                <h1>AI SQL Assistant</h1>
                <p>Turn natural language into SQL queries.</p>
            </div>

            <h2>Welcome back</h2>
            <p class="subtitle">Log in to continue to your workspace.</p>

            <form id="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input
                        type="text"
                        id="login-username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div id="login-message" class="message" role="status"
                     aria-live="polite"></div>

                <button type="submit" id="login-button" class="auth-button">
                    Log in
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="/api/register-page/">Create account</a>
            </p>
        </section>
    </main>
</body>
</html>
